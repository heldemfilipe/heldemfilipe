<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 112" width="1200" height="112" role="img" aria-label="aws-auditor (Java): Auditor de conta AWS: varredura multi-região em paralelo, DynamoDB, API com aviso no Telegram, imagem e Terraform. Nunca rodou em conta real.">
