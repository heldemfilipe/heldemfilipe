<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 258" width="1200" height="258" role="img" aria-label="Certificações AWS: Solutions Architect Associate, Developer Associate e Cloud Practitioner">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bd93f9"/>
      <stop offset="50%" stop-color="#ff79c6"/>
      <stop offset="100%" stop-color="#8be9fd"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#44475a" opacity="0.5"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="258" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,DejaVu Sans Mono,monospace">
    <rect width="1200" height="258" fill="#282a36"/>
    <rect width="1200" height="258" fill="url(#dots)"/>
    <rect width="1200" height="46" fill="#21222c"/>
    <circle cx="34" cy="23.0" r="7" fill="#ff5555"/>
    <circle cx="58" cy="23.0" r="7" fill="#f1fa8c"/>
    <circle cx="82" cy="23.0" r="7" fill="#50fa7b"/>
    <text x="600.0" y="28.0" text-anchor="middle" font-size="15" fill="#6272a4">heldemfilipe@cloud: ~/certs</text>

    <text x="48" y="88" font-size="22"><tspan fill="#50fa7b">$</tspan><tspan fill="#f8f8f2" dx="12">aws certs --list</tspan></text>
    <text x="48" y="146" font-size="16"><tspan fill="#50fa7b">✔</tspan><tspan fill="#f8f8f2" dx="12">AWS Certified Solutions Architect – Associate</tspan></text>
    <text x="760" y="146" font-size="14" fill="#8be9fd">SAA-C03</text>
    <text x="1152" y="146" text-anchor="end" font-size="14" fill="#6272a4">ago/2026</text>
    <text x="48" y="184" font-size="16"><tspan fill="#50fa7b">✔</tspan><tspan fill="#f8f8f2" dx="12">AWS Certified Developer – Associate</tspan></text>
    <text x="760" y="184" font-size="14" fill="#8be9fd">DVA-C02</text>
    <text x="1152" y="184" text-anchor="end" font-size="14" fill="#6272a4">out/2026</text>
    <text x="48" y="222" font-size="16"><tspan fill="#50fa7b">✔</tspan><tspan fill="#f8f8f2" dx="12">AWS Certified Cloud Practitioner</tspan></text>
    <text x="760" y="222" font-size="14" fill="#8be9fd">CLF-C02</text>
    <text x="1152" y="222" text-anchor="end" font-size="14" fill="#6272a4">nov/2026</text>

    <rect x="0.75" y="0.75" width="1198.5" height="256.5" rx="18" fill="none" stroke="#44475a" stroke-width="1.5"/>
  </g>
</svg>
